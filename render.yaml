previewsEnabled: false
services:
  # -------------------------------------------------------------
  # Frontend (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: studyforge-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: studyforge-backend
          envVarKey: RENDER_EXTERNAL_URL

  # -------------------------------------------------------------
  # Backend (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: studyforge-backend
    env: docker
    rootDir: backend
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: studyforge-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: BACKEND_URL
        fromService:
          type: web
          name: studyforge-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: studyforge-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        value: "postgresql+asyncpg://postgres.bhdmngifohucafjlvcpo:STUDYforge%40123@aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres"
      - key: MONGODB_DATABASE
        value: studyforge
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: studyforge-redis
          property: connectionString

  # -------------------------------------------------------------
  # Managed Redis Cache
  # -------------------------------------------------------------
  - type: redis
    name: studyforge-redis
    ipAllowList: []
    plan: free
